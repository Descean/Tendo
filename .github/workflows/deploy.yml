name: Tendo - Vérification syntaxe

on:
  push:
    branches: [main]

jobs:
  test:
    name: Vérification syntaxe Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier syntaxe
        run: |
          find app -name "*.py" -exec python -m py_compile {} +
          echo "✅ Syntaxe Python OK"
